{% extends "base.html" %}

{% block title %}Tags | {{ config.title }}{% endblock %}

{% block content %}
<h1 class="page-title">Tags</h1>
<ul class="tag-list">
  {% for term in terms %}
  <li>
    <a class="tag-chip" href="{{ term.permalink }}">{{ term.name }}</a>
    <span class="post-count">({{ term.pages | length }})</span>
  </li>
  {% endfor %}
</ul>
{% endblock %}
