{% extends "base.html" %}

{% block title %}#{{ term.name }} | {{ config.title }}{% endblock %}

{% block content %}
<h1 class="page-title">#{{ term.name }}</h1>
<ul class="post-list">
  {% for post in term.pages %}
  <li>
    <span class="post-date">{{ post.date | date(format="%b %-d, %Y") }}</span>
    <a href="{{ post.permalink }}">{{ post.title }}</a>
  </li>
  {% endfor %}
</ul>
<p class="post-nav"><a href="{{ config.base_url }}/tags">&#8592; All tags</a></p>
{% endblock %}
