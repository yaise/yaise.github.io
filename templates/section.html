{% extends "base.html" %}

{% block title %}{{ section.title }} | {{ config.title }}{% endblock %}

{% block content %}
<h1 class="page-title">{{ section.title }}</h1>
<ul class="post-list">
  {% for post in section.pages %}
  <li>
    <span class="post-date">{{ post.date | date(format="%b %-d, %Y") }}</span>
    <a href="{{ post.permalink }}">{{ post.title }}</a>
  </li>
  {% endfor %}
</ul>
{% endblock %}
